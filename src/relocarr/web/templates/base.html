<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>relocarr{% block title %}{% endblock %}</title>
<link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
<link rel="alternate icon" type="image/png" href="/static/favicon.png">
<style>
  :root {
    --bg-sidebar: #27272b;
    --bg-content: #1a1a1d;
    --bg-card: #222225;
    --bg-input: #2c2c30;
    --border: #3a3a3e;
    --text: #d6d6d9;
    --text-dim: #8a8a8f;
    --accent: #f2a900;
    --btn-primary: #3a7bd5;
    --btn-danger: #d9534f;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
    background: var(--bg-content);
    color: var(--text);
    display: flex;
    min-height: 100vh;
  }
  nav.sidebar {
    width: 380px;
    background: var(--bg-sidebar);
    flex-shrink: 0;
    padding: 16px 0;
  }
  nav.sidebar .logo {
    display: flex;
    align-items: center;
    flex-wrap: wrap;
    gap: 16px;
    padding: 0 20px 28px;
    font-size: 40px;
    font-weight: 700;
    color: var(--accent);
    letter-spacing: 0.5px;
  }
  nav.sidebar .logo img { border-radius: 8px; flex-shrink: 0; }
  nav.sidebar a {
    display: block;
    padding: 10px 20px;
    color: var(--text);
    text-decoration: none;
    font-size: 14px;
  }
  nav.sidebar a.sub { padding: 8px 20px 8px 36px; font-size: 13px; }
  nav.sidebar a:hover { background: #323236; }
  nav.sidebar a.active { color: var(--accent); font-weight: 600; }
  main {
    flex: 1;
    padding: 28px 36px;
  }
  h1 { font-weight: 600; font-size: 22px; margin: 0 0 20px; }
  table { width: 100%; border-collapse: collapse; }
  th, td { text-align: left; padding: 10px 12px; border-bottom: 1px solid var(--border); font-size: 14px; }
  th { color: var(--text-dim); font-weight: 600; text-transform: uppercase; font-size: 11px; }
  .card { background: var(--bg-card); border: 1px solid var(--border); border-radius: 4px; padding: 20px; margin-bottom: 16px; }
  .empty-state { color: var(--text-dim); padding: 40px 0; text-align: center; }
  label { display: block; font-size: 13px; color: var(--text-dim); margin: 14px 0 4px; }
  input[type=text], input[type=url], input[type=number], select {
    width: 100%; max-width: 420px; padding: 8px 10px; background: var(--bg-input);
    border: 1px solid var(--border); border-radius: 3px; color: var(--text); font-size: 14px;
  }
  button {
    margin-top: 18px; padding: 8px 18px; border-radius: 3px; border: none;
    background: var(--btn-primary); color: white; font-size: 14px; cursor: pointer;
  }
  button:hover { opacity: 0.9; }
  .badge { display: inline-block; padding: 2px 8px; border-radius: 3px; font-size: 11px; background: #2e7d32; color: white; }
  .error { color: #f28b82; margin-bottom: 12px; }
  .nav-badge {
    display: inline-block; min-width: 18px; padding: 1px 6px; margin-left: 6px;
    border-radius: 9px; font-size: 11px; font-weight: 700; text-align: center;
    color: #1a1a1d;
  }
  .nav-badge.warning { background: #e0a84e; }
  .nav-badge.error { background: var(--btn-danger); color: white; }
</style>
</head>
<body>
  <nav class="sidebar">
    <div class="logo"><img src="/static/favicon.svg" width="48" height="48" alt=""> RELOCARR</div>
    <a href="/log" class="{% block nav_log %}{% endblock %}">Library</a>
    <a href="/jobs" class="{% block nav_jobs %}{% endblock %}">Queue</a>
    <a href="/settings/apps" class="{% block nav_settings %}{% endblock %}">Settings</a>
    {% if request.url.path.startswith('/settings') %}
    <a href="/settings/apps/new" class="sub {% block nav_settings_add_app %}{% endblock %}">Add App</a>
    <a href="/settings/apps" class="sub {% block nav_settings_app_config %}{% endblock %}">App Config</a>
    <a href="/settings/download-clients" class="sub {% block nav_settings_download_clients %}{% endblock %}">Download Clients</a>
    <a href="/settings/general" class="sub {% block nav_settings_general %}{% endblock %}">General</a>
    {% endif %}
    <a href="/setup-guide" class="{% block nav_setup_guide %}{% endblock %}">Setup Guide</a>
    {% set issues = sidebar_issues() %}
    <a href="/system" class="{% block nav_system %}{% endblock %}">System{% if issues.count %}<span class="nav-badge {{ issues.level }}">{{ issues.count }}</span>{% endif %}</a>
  </nav>
  <main>
    {% block content %}{% endblock %}
  </main>
  <script>
    // Generic click-to-sort for every table in the app, applied here once
    // rather than wired per-page: a plain server-rendered table has no
    // inherent column type, so this sorts each column by number (stripping
    // a trailing GB/MB/KB unit, e.g. "2.43 GB") when the WHOLE cell text
    // matches that shape, falling back to a case-insensitive string sort
    // otherwise -- which also correctly orders "YYYY-MM-DD"-style date
    // columns, since lexicographic order already matches chronological
    // order for that format. Header cells with no text (checkbox/poster
    // columns) are skipped -- there's no sensible key to sort by.
    (function () {
      var NUMERIC_RE = /^-?\d+(\.\d+)?\s*(GB|MB|KB)?$/i;

      function sortKey(cell) {
        var text = cell.textContent.trim();
        if (NUMERIC_RE.test(text)) {
          return { num: parseFloat(text) };
        }
        return { str: text.toLowerCase() };
      }

      function compareKeys(a, b) {
        if (a.num !== undefined && b.num !== undefined) return a.num - b.num;
        var as = a.str !== undefined ? a.str : String(a.num);
        var bs = b.str !== undefined ? b.str : String(b.num);
        if (as < bs) return -1;
        if (as > bs) return 1;
        return 0;
      }

      document.querySelectorAll("table").forEach(function (table) {
        var headerRow = table.querySelector("tr");
        if (!headerRow) return;
        var headerCells = Array.prototype.slice.call(headerRow.children);
        var state = { index: -1, dir: 1 };

        headerCells.forEach(function (th, index) {
          if (!th.textContent.trim()) return;
          th.style.cursor = "pointer";
          th.style.userSelect = "none";
          var indicator = document.createElement("span");
          indicator.style.marginLeft = "4px";
          indicator.style.opacity = "0.6";
          th.appendChild(indicator);

          th.addEventListener("click", function () {
            var dir = state.index === index ? -state.dir : 1;
            state = { index: index, dir: dir };

            headerCells.forEach(function (c) {
              var span = c.querySelector("span");
              if (span) span.textContent = "";
            });
            indicator.textContent = dir === 1 ? "▲" : "▼";

            var rows = Array.prototype.slice.call(table.querySelectorAll("tr")).slice(1);
            rows.sort(function (r1, r2) {
              var c1 = r1.children[index];
              var c2 = r2.children[index];
              if (!c1 || !c2) return 0;
              return dir * compareKeys(sortKey(c1), sortKey(c2));
            });
            rows.forEach(function (row) {
              table.appendChild(row);
            });
          });
        });
      });
    })();

    // A checkbox marked class="select-all" toggles every other checkbox in
    // the same table -- works regardless of sort order above, since it
    // re-queries the table's checkboxes live rather than caching a row list.
    (function () {
      document.querySelectorAll("input.select-all").forEach(function (master) {
        var table = master.closest("table");
        if (!table) return;
        master.addEventListener("change", function () {
          table.querySelectorAll('input[type="checkbox"]').forEach(function (cb) {
            if (cb !== master) cb.checked = master.checked;
          });
        });
      });
    })();

    // Every form's submit button disables itself on submit, with its text
    // swapped to "Working..." -- confirmed live, 2026-10-29: a form whose
    // action genuinely takes a while (e.g. the Log page's bulk redownload,
    // one live Radarr release search per checked file) gave no visual
    // feedback at all while the browser sat on the blocked POST, which
    // looked indistinguishable from the page having frozen. Applied to
    // every form site-wide, not just the slow ones -- a cheap, generic
    // improvement that also stops an impatient double-click from
    // double-submitting whatever the form does. Page navigation (the
    // normal POST-redirect-GET this app always does) replaces the DOM
    // anyway, so there's no "stuck disabled forever" state to undo.
    (function () {
      document.querySelectorAll("form").forEach(function (form) {
        form.addEventListener("submit", function () {
          form.querySelectorAll('button[type="submit"]').forEach(function (btn) {
            btn.disabled = true;
            btn.textContent = "Working…";
          });
        });
      });
    })();
  </script>
</body>
</html>
